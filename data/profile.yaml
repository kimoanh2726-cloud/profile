bio:
  vi: >
    Tôi là sinh viên năm 3 ngành Tôn giáo học tại Đại học Khoa học Xã hội 
    và Nhân văn TP.HCM. Đam mê nghiên cứu tôn giáo so sánh, đặc biệt là 
    mối quan hệ giữa Phật giáo Theravāda và tín ngưỡng dân gian Nam Bộ. 
    Đã tham gia nhiều dự án điền dã tại các cộng đồng Khmer ở Đồng bằng 
    Sông Cửu Long.
  en: >
    I am a third-year Religious Studies student at the University of Social 
    Sciences and Humanities (HCMC). Passionate about comparative religion, 
    with a focus on the interplay between Theravāda Buddhism and folk beliefs 
    in Southern Vietnam. Experienced in ethnographic fieldwork among Khmer 
    communities in the Mekong Delta.

