- id: res-theravada-mekong
  title:
    vi: "Phật giáo Theravāda và tín ngưỡng dân gian trong đời sống cộng đồng Khmer Nam Bộ"
    en: "Theravāda Buddhism and Folk Beliefs in Khmer Communities of Southern Vietnam"
  type: paper
  abstract:
    vi: >
      Bài nghiên cứu phân tích sự đan xen giữa Phật giáo Theravāda và tín ngưỡng 
      dân gian (thờ Neak Tà, cúng Óc Om Bóc) trong sinh hoạt hằng ngày của cộng đồng 
      Khmer tại Trà Vinh. Sử dụng phương pháp dân tộc học, bài viết chỉ ra rằng hai 
      hệ thống tín ngưỡng không đối lập mà bổ trợ lẫn nhau, tạo nên bản sắc tôn giáo 
      đặc thù của vùng Đồng bằng Sông Cửu Long.
    en: >
      This paper analyzes the interweaving of Theravāda Buddhism and folk beliefs 
      (Neak Ta worship, Ok Om Bok rituals) in the daily life of Khmer communities 
      in Tra Vinh province. Using ethnographic methods, the study demonstrates that 
      these two belief systems are not oppositional but complementary, forming a 
      distinctive religious identity of the Mekong Delta region.
  authors:
    - "Nguyễn Minh Thiện"
    - "PGS.TS. Trần Văn Đạo"
  publication:
    vi: "Tạp chí Nghiên cứu Tôn giáo, số 5/2026"
    en: "Journal of Religious Studies, No. 5/2026"
  date: "2026-05"
  doi: "10.xxxx/example-doi-001"
  tags: [nghien-cuu, hoc-thuat, hoc-bong]
  visibility: public
  documentPath: "/documents/research/theravada-mekong-2026.pdf"

